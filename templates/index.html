<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRC Book Search</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <header class="site-header">
        <h1>IRC Book Search</h1>
        <div class="header-controls">
            <div class="status-bar">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Checking status...</span>
            </div>
            <div class="header-progress hidden" id="headerProgress">
                <span class="progress-text" id="progressText"></span>
                <div class="progress-bar-mini">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
            <button class="btn btn-secondary btn-small" id="editConfigBtn">Edit Config</button>
            <button class="connect-btn connect" id="connectBtn">Connect</button>
            <button class="btn btn-danger btn-small" id="shutdownBtn">Shutdown</button>
        </div>
    </header>

    <div class="banner hidden" id="banner"></div>

    <main class="content">
    <div class="card" id="configCard">
        <h2 style="margin-bottom: 8px;">IRC Configuration</h2>
        <form class="config-form" id="configForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="configNick">Nickname</label>
                    <input type="text" id="configNick" name="nick" placeholder="e.g., BookLover42" required>
                </div>
                <div class="form-group">
                    <label for="configUsername">Username</label>
                    <input type="text" id="configUsername" name="username" placeholder="e.g., booklover" required>
                </div>
            </div>
            <div class="form-group">
                <label for="configRealname">Real Name</label>
                <input type="text" id="configRealname" name="realname" placeholder="e.g., Book Enthusiast" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="configServer">IRC Server</label>
                    <input type="text" id="configServer" name="server" value="irc.irchighway.net" required>
                </div>
                <div class="form-group form-group-small">
                    <label for="configPort">Port</label>
                    <input type="number" id="configPort" name="port" value="6669" min="1" max="65535" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="configChannel">Channel</label>
                    <input type="text" id="configChannel" name="channel" value="#ebooks" required>
                </div>
                <div class="form-group form-group-small">
                    <label for="configIdleTimeout">Idle (min)</label>
                    <input type="number" id="configIdleTimeout" name="idle_timeout" placeholder="20" min="1" required>
                </div>
                <div class="form-group form-group-small">
                    <label for="configSearchTimeout">Search (sec)</label>
                    <input type="number" id="configSearchTimeout" name="search_timeout" placeholder="60" min="1" required>
                </div>
            </div>
            <div class="form-group">
                <label for="configDownloadPath">Download Path</label>
                <input type="text" id="configDownloadPath" name="download_path" value="./files" required>
            </div>
            <div class="form-row">
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="configAutoConnect" name="auto_connect" checked>
                        Auto-connect on startup
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Save</button>
                    <button type="button" class="btn btn-secondary hidden" id="cancelConfigBtn">Cancel</button>
                </div>
            </div>
        </form>
        <div id="configError" class="error hidden"></div>
    </div>

    <div class="card">
        <h2>Search</h2>
        <div id="searchTermDisplay"></div>
        <form class="search-form" id="searchForm">
            <input type="text" name="term" id="searchInput" placeholder="Enter search term..." required>
            <button type="submit" id="searchBtn">Search</button>
        </form>
        <div id="error" class="error hidden"></div>
    </div>


    <div class="card hidden" id="linesCard">
        <h2>Select Lines to Download</h2>
        <p>Select the items you want to download:</p>
        <div class="lines-container" id="linesContainer"></div>
        <br>
        <button class="btn" id="selectAllBtn">Select All</button>
        <button class="btn btn-secondary" id="unselectAllBtn">Unselect All</button>
        <button class="btn" id="downloadSelectedBtn">Download Selected</button>
    </div>

    <div class="card">
        <h2>Downloaded Files</h2>
        <div class="file-search">
            <input type="text" id="fileSearchInput" placeholder="Search files...">
        </div>
        <div class="file-count" id="fileCount"></div>
        <ul class="files-list" id="filesList">
            <li>No files downloaded yet.</li>
        </ul>
        <div class="pagination" id="filesPagination">
            <button id="filesPrevBtn" disabled>Previous</button>
            <span id="filesPageInfo">Page 1 of 1</span>
            <button id="filesNextBtn" disabled>Next</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Search Saved Results</h2>
            <button class="btn btn-danger btn-small" id="clearDbBtn">Clear Database</button>
        </div>
        <div class="db-stats" id="dbStats"></div>
        <div class="db-search">
            <input type="text" id="dbSearchInput" placeholder="Search saved results (e.g., tolkien hobbit epub)...">
        </div>
        <div class="db-results-container" id="dbResultsContainer">
            <p class="db-results-empty">Enter a search term or browse all results below.</p>
        </div>
        <div class="db-results-actions hidden" id="dbResultsActions">
            <button class="btn" id="dbSelectAllBtn">Select All</button>
            <button class="btn btn-secondary" id="dbUnselectAllBtn">Unselect All</button>
            <button class="btn" id="dbDownloadBtn">Download Selected</button>
        </div>
        <div class="pagination" id="dbPagination">
            <button id="dbPrevBtn" disabled>Previous</button>
            <span id="dbPageInfo">Page 1 of 1</span>
            <button id="dbNextBtn" disabled>Next</button>
        </div>
    </div>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
